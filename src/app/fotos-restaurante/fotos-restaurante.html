<section class="fotos-restaurante">
  <h2 class="Titulo">Enamórate de <span>la Manila</span></h2>

  <div class="carousel-dark">
    <button class="nav-btn nav-prev" (click)="scrollByAmount(-320)" aria-label="Anterior">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div
      class="track"
      #track
      (mousedown)="startDrag($event)"
      (mousemove)="onDrag($event)"
      (mouseup)="endDrag()"
      (mouseleave)="endDrag()">

      <div class="Imagen">
        <img src="https://abya.es/wp-content/uploads/2026/07/abya-restaurante-en-madrid-de-lujo-carrusel-11.jpg" alt="Imagen 1">
      </div>
      <div class="Imagen">
        <img src="https://abya.es/wp-content/uploads/2026/07/abya-restaurante-de-lujo-en-madrid-carrusel-4.jpg" alt="Imagen 2">
      </div>
      <div class="Imagen">
        <img src="https://abya.es/wp-content/uploads/2026/07/abya-restaurantes-madrid-carrusel-5.jpg" alt="Imagen 3">
      </div>
      <div class="Imagen">
        <img src="https://abya.es/wp-content/uploads/elementor/thumbs/abya-restaurantes-en-madrid-carrusel-7-rq5eclfgd3i5t41emtoeqqqilu9gsjzepb4rxf2fwg.jpg" alt="Imagen 4">
      </div>
      <div class="Imagen">
        <img src="https://abya.es/wp-content/uploads/elementor/thumbs/abya-restaurantes-de-lujo-madrid-carrusel-8-rq5ecnb4qrkqgbyobuhnvq9fsm077y6vdkfqvyznk0.jpg" alt="Imagen 5">
      </div>
      <div class="Imagen">
        <img src="https://abya.es/wp-content/uploads/2023/10/abya_events_05-1.jpg" alt="Imagen 6">
      </div>

    </div>

    <button class="nav-btn nav-next" (click)="scrollByAmount(320)" aria-label="Siguiente">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>
</section>
